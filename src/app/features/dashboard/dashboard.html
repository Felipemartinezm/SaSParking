<div class="min-h-screen bg-gray-950 text-white flex flex-col">
  <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <div class="w-10 h-10 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
      </div>
      <h1 class="text-xl font-bold tracking-tight">SaSParking</h1>
    </div>
    
    <div class="flex items-center space-x-6">
      <div class="hidden sm:block text-right">
        <p class="text-sm font-medium text-gray-200" *ngIf="profile$ | async as profile">{{ profile.full_name }}</p>
        <p class="text-xs text-gray-500" *ngIf="profile$ | async as profile">{{ profile.companies?.name }}</p>
      </div>
      <button (click)="signOut()" class="text-gray-400 hover:text-white transition-colors focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
      </button>
    </div>
  </nav>

  <main class="flex-1 flex flex-col items-center justify-center p-6 text-center">
    <div *ngIf="profile$ | async as profile" class="max-w-2xl">
      <div class="inline-block p-4 rounded-full bg-cyan-900/30 text-cyan-400 mb-6 border border-cyan-800/50">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
        </svg>
      </div>
      <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4 text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">
        Bienvenido a <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">{{ profile.companies?.name || 'tu empresa' }}</span>
      </h2>
      <p class="text-xl text-gray-500 mb-8">
        Has iniciado sesión correctamente como {{ profile.role }}. Esta es tu página inicial multi-empresa.
      </p>
    </div>
    
    <div *ngIf="(profile$ | async) === null" class="animate-pulse flex flex-col items-center">
      <div class="h-8 bg-gray-800 rounded w-64 mb-4"></div>
      <div class="h-4 bg-gray-800 rounded w-48"></div>
    </div>
  </main>
</div>
