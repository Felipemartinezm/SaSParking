<main class="min-h-screen bg-gray-950 text-white flex flex-col items-center justify-center p-6">
  <div class="max-w-3xl w-full bg-gray-900 border border-gray-800 rounded-2xl p-10 shadow-2xl transition-all hover:shadow-cyan-500/10">
    <div class="flex items-center justify-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg transform rotate-3 hover:rotate-6 transition-transform cursor-pointer">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
      </div>
    </div>
    
    <h1 class="text-4xl md:text-5xl font-extrabold text-center mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
      Angular 21 & Tailwind CSS
    </h1>
    
    <p class="text-gray-400 text-center text-lg mb-10 max-w-2xl mx-auto">
      Tu entorno de desarrollo está configurado y listo. Empieza a construir interfaces asombrosas y dinámicas hoy mismo.
    </p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <button class="px-6 py-3 rounded-xl font-medium bg-white text-gray-900 hover:bg-gray-100 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-900">
        Comenzar Proyecto
      </button>
      <button class="px-6 py-3 rounded-xl font-medium border border-gray-700 bg-transparent text-white hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-700 focus:ring-offset-2 focus:ring-offset-gray-900">
        Ver Documentación
      </button>
    </div>
  </div>
</main>
